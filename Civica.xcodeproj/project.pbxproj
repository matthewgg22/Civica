			shellScript = "# Copies canonical SNAP rules JSON from packages/snap-rules/data/\n# into the iOS resource tree so Civica/Features/SNAP/SNAPRules/*.json\n# never drift from the H-web authored source.\n#\n# No-op when packages/snap-rules/data/ does not exist yet (stub mode).\n# Remove the existence guard once H-web merges packages/snap-rules.\nset -euo pipefail\nRULES_SRC=\"${SRCROOT}/packages/snap-rules/data\"\nRULES_DST=\"${SRCROOT}/Civica/Features/SNAP/SNAPRules\"\nif [ -d \"${RULES_SRC}\" ]; then\n  cp \"${RULES_SRC}/ca.json\" \"${RULES_DST}/snap_rules_ca.json\"\n  cp \"${RULES_SRC}/ma.json\" \"${RULES_DST}/snap_rules_ma.json\"\n  echo \"Sync SNAP Rules JSON: copied ca.json + ma.json\"\nelse\n  echo \"Sync SNAP Rules JSON: packages/snap-rules/data not found — using stubs\"\nfi\n";
