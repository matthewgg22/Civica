name: Enrollment API CI

on:
  push:
    branches: [main, codex/rebuild-feb18, "claude/*", "codex/*"]
    paths:
      - "apps/enrollment-api/**"
      - ".github/workflows/enrollment-api-ci.yml"
  pull_request:
    paths:
      - "apps/enrollment-api/**"
      - ".github/workflows/enrollment-api-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/enrollment-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/enrollment-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Placeholder credentials — all Supabase calls are mocked in tests.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SNAP_FERNET_KEY: placeholder-fernet-key-32bytes!!

      - name: Wrangler dry-run build
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          CLOUDFLARE_API_TOKEN: placeholder
