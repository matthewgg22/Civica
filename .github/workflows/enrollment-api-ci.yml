name: Enrollment API CI

on:
  push:
    branches: [main, "claude/*", "codex/*"]
    paths:
      - "apps/enrollment-api/**"
      - ".github/workflows/enrollment-api-ci.yml"
  pull_request:
    paths:
      - "apps/enrollment-api/**"
      - ".github/workflows/enrollment-api-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/enrollment-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/enrollment-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Wrangler dry-run build
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          CLOUDFLARE_API_TOKEN: placeholder
