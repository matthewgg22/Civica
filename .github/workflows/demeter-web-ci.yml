name: Demeter web CI

# The public Demeter surface (apps/web) + engine integration:
#   unit        — apps/web vitest (routes, usage gate, chat renderer)
#   counter-pg  — usage-counter RPC atomicity against REAL Postgres: creates
#                 the Supabase roles, applies the demeter migrations verbatim
#                 (so their SQL is validated on every PR), then hammers the
#                 increment RPC concurrently
#   e2e-smoke   — production build + Playwright against next start, NO
#                 ANTHROPIC_API_KEY: asserts the honest degraded states
#                 (chat renders + send yields a response state; growth pages
#                 render their headings)

on:
  pull_request:
    branches:
      - main
      - codex/rebuild-feb18
    paths:
      - 'apps/web/**'
      - 'packages/demeter-engine/**'
      - 'supabase/migrations/*demeter*'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/demeter-web-ci.yml'
  workflow_dispatch:

jobs:
  unit:
    name: apps/web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm --filter civica-web run test

  counter-pg:
    name: Usage-counter RPC vs real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demeter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/demeter_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply demeter migrations to a Supabase-shaped database
        # Vanilla postgres lacks the Supabase schema/roles the migrations
        # GRANT against — create them first, then apply the migration files
        # VERBATIM so any SQL error in them fails this job.
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS snap_enrollment;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260610_demeter_usage_counters.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260611_demeter_supporters.sql

      - name: Run counter concurrency spec
        run: pnpm --filter civica-web run test:pg

  e2e-smoke:
    name: Playwright smoke (build + start, no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (production, webpack + model tracing)
        run: pnpm turbo run build --filter=civica-web

      - name: Run smoke suite
        working-directory: apps/web
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demeter-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
