name: Civica build + test

# Runs on every PR against codex/rebuild-feb18 (the Civica trunk)
# so the rules engine's test target catches regressions before
# merge. Builds only the Civica scheme (gov-benefits app); VoteNow
# has its own pipeline.

on:
  pull_request:
    branches:
      - codex/rebuild-feb18
    paths:
      - 'Civica/**'
      - 'Civica Tests/**'
      - 'Civica.xcodeproj/**'
      - 'CivicaDesignSystem/**'
      - '.github/workflows/civica-test.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Need Xcode 26.x for iOS 26 FoundationModels / @Generable
        # used by the Voice extraction layer. setup-xcode picks the
        # highest available Xcode 26.x on the runner (which floats
        # patch-by-patch as GitHub updates macos-15 images), instead
        # of pinning a specific patch that may not yet be installed.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.0'

      - name: Show toolchain (pre-install)
        run: |
          xcodebuild -version
          echo "--- iOS simulator runtimes (pre-install) ---"
          xcrun simctl list runtimes | grep iOS || true

      - name: Install iOS simulator runtime
        # GitHub macos-15 images ship Xcode bundles without their
        # paired iOS simulator runtimes to save image size, so
        # `xcodebuild test` fails with "iOS XX.X is not installed."
        # Downloading the runtime that pairs with the selected
        # Xcode (here: Xcode 26.x -> iOS 26 SDK) takes a few minutes
        # but is the only reliable path until GitHub re-ships runtimes.
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Show toolchain (post-install)
        run: |
          echo "--- iOS simulator runtimes (post-install) ---"
          xcrun simctl list runtimes | grep iOS || true
          echo "--- iPhone simulator devices ---"
          xcrun simctl list devices available | grep -E 'iPhone' || true

      - name: Build Civica scheme
        run: |
          xcodebuild \
            -project Civica.xcodeproj \
            -scheme Civica \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build

      - name: Run CivicaTests
        run: |
          # Booted simulator UDID from the runtime list; falls back
          # to a destination-name spec if not pinned.
          xcodebuild \
            -project Civica.xcodeproj \
            -scheme Civica \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: civica-xcresult-${{ github.sha }}
          path: ~/Library/Developer/Xcode/DerivedData/Civica-*/Logs/Test/*.xcresult
          retention-days: 7
