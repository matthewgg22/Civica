name: Civica build + test

# Runs on every PR against the SNAP branch family so the rules
# engine's test target catches regressions before merge. Builds
# only the Civica scheme (gov-benefits app); the VoteNow target
# has its own pipeline.

on:
  pull_request:
    branches:
      - claude/civica-snap-v1
      - 'claude/civica-snap-**'
    paths:
      - 'Civica/**'
      - 'Civica Tests/**'
      - 'Civica.xcodeproj/**'
      - 'CivicaDesignSystem/**'
      - '.github/workflows/civica-test.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pin to the Xcode version local development uses; bump
        # together with the project's GENERATE_INFOPLIST_FILE etc.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | head -20

      - name: Build Civica scheme
        run: |
          xcodebuild \
            -project Civica.xcodeproj \
            -scheme Civica \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build

      - name: Run CivicaTests
        run: |
          # Booted simulator UDID from the runtime list; falls back
          # to a destination-name spec if not pinned.
          xcodebuild \
            -project Civica.xcodeproj \
            -scheme Civica \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: civica-xcresult-${{ github.sha }}
          path: ~/Library/Developer/Xcode/DerivedData/Civica-*/Logs/Test/*.xcresult
          retention-days: 7
