name: regops-poll

# RegOps Engine — scheduled polling loop.
#
# Runs every hour. The SourceAdapterBase rate cap (1h floor per source)
# means each source gets polled at most once per cron tick. Sources with
# their own faster cadence override pollIntervalMs and run more often
# inside their own adapter logic — that's a per-source detail, not a
# scheduling concern here.
#
# What this workflow does today:
#   - constructs the production adapter registry
#   - runs one pollOnce() tick
#   - persists snapshots to regops.snapshots (Supabase) when the
#     SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY secrets are set; otherwise
#     prints them as JSONL to stdout for the run log to capture
#   - writes audit-log entries to regops.source_audit_log (Supabase) when
#     those same secrets are set; otherwise keeps them in-memory (lost
#     on process exit, only acceptable for local dev)
#   - routes alerts to Sentry via SentryAlertEmitter when the SENTRY_DSN
#     repo secret is set; otherwise falls back to stderr-only output
#   - fails the run on structural failure / source-wedged / unexpected
#     throws (page-severity outcomes per the runbook)
#
# Operator activation (all three groups of secrets are independent):
#   - SENTRY_DSN                  → alert delivery
#   - SUPABASE_URL +              → audit log + snapshot persistence
#     SUPABASE_SERVICE_ROLE_KEY      (both required; either alone falls back)
#
# Without any secrets, the cron still runs and exercises the adapters
# end-to-end — outputs just stay in the GH Actions log instead of
# persisting / paging. Useful for first-deploy smoke tests on a fork.

on:
  schedule:
    - cron: "5 * * * *" # 5 minutes past every hour
  workflow_dispatch:

concurrency:
  group: regops-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - uses: pnpm/action-setup@v4
        # Version is read from packageManager in root package.json. Do NOT
        # specify `with: version:` here — pnpm/action-setup@v4 errors with
        # "Multiple versions of pnpm specified" when both sources declare
        # a version, even if the versions agree.
        # run_install defaults to false, which is what we want.

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Run polling tick
        working-directory: packages/regops-engine
        env:
          # SENTRY_DSN: Sentry project DSN for the `civica-regops` project.
          # When set, SentryAlertEmitter routes page/warn alerts to Sentry
          # (which alert rules then page on). When unset, alerts still
          # land in the GH Actions stderr log but don't page anywhere.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY: writes-side
          # credentials for regops.source_audit_log + regops.snapshots.
          # Service-role key is required because both tables' RLS only
          # allows service_role to INSERT (counsel get domain-scoped
          # SELECT via the policies in migrations 20260594 + 20260595).
          # Both secrets must be set together; either alone falls back
          # to in-memory + JSONL stdout.
          #
          # NOTE: sourced from the existing E2E_SUPABASE_* secrets to
          # avoid duplicating the canonical Civica project URL + key
          # into two secret slots that would drift on key rotation.
          # The E2E_ prefix is historical (the secrets were originally
          # provisioned for e2e-nightly.yml); they point to the same
          # production Supabase project the regops-engine writes into.
          # A separate cleanup PR can rename E2E_SUPABASE_* →
          # SUPABASE_* and update both consumers in lockstep.
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run regops:poll
