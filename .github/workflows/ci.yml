name: CI

on:
  pull_request:
  push:
    branches: [codex/rebuild-feb18]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    name: Build & Unit Test (iOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Civica.xcodeproj \
            -scheme VoteNow \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
