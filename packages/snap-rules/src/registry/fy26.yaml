# Verification-hyperdrive Layer 3 registry — FY26 seed.
#
# Every time-sensitive constant, boolean, AND citation gets an owner,
# source URL, effective date, and expiry. Engine reads from here (or
# tables are generated from here) so a primary-source correction
# propagates through every consumer.
#
# Schema validated by registry/load.ts. Linted by registry/lint.ts
# (staleness + citation-URL resolves).
#
# DO NOT add a value without a primary-source URL. DO NOT add a
# citation without a live fetch of its URL.

