# Local dev stack for the SNAP API gateway.
#
# Brings up Postgres + the Hono gateway. The FastAPI engine (backend/)
# is NOT yet containerized — run it locally with uvicorn until Phase 17.
#
# Quickstart:
#   docker compose up           # Postgres + API gateway
#   docker compose up postgres  # Postgres only (run Hono on host)

services:
  postgres:
    image: postgres:16-alpine
    container_name: civica-postgres
    environment:
      POSTGRES_USER: civica
      POSTGRES_PASSWORD: civica
      POSTGRES_DB: civica_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civica -d civica_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: civica-api
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://civica:civica@postgres:5432/civica_dev
      # ENGINE_BASE_URL: http://host.docker.internal:8000   # FastAPI on host
      # ENGINE_BASE_URL: http://api-engine:8000             # once engine is containerized (Phase 17)
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the whole workspace for hot reload via `tsx watch`.
      - .:/workspace
      # Anonymous volumes preserve container-installed node_modules against
      # the host bind mount above (host install is darwin-arm64, container
      # needs linux). Do NOT remove these or builds break with native deps.
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
