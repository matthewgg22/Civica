<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica Submitter — Options</title>
  <style>
    body {
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #1f2722;
      margin: 0;
      padding: 32px;
    }
    main { max-width: 520px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.subtitle { margin: 0 0 24px; color: #5a5851; }
    label { display: block; margin-top: 16px; }
    label .lbl {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5a5851;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbc6bc;
      border-radius: 3px;
      font: inherit;
      background: #fff;
    }
    button {
      margin-top: 24px;
      padding: 8px 16px;
      background: #1f4d3b;
      color: #fff;
      border: none;
      border-radius: 3px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button[disabled] { background: #ccc; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 1.4em;
    }
    .status.ok { color: #1f4d3b; }
    .status.err { color: #8b1d11; }
  </style>
</head>
<body>
  <main>
    <h1>Civica Submitter</h1>
    <p class="subtitle">
      Sideload trial build. Configure the Civica gateway URL and your assister
      bearer token to enable autofill on BenefitsCal CBO pages.
    </p>

    <label>
      <span class="lbl">Civica gateway URL</span>
      <input id="baseUrl" type="text" placeholder="https://civica-api.workers.dev" />
    </label>

    <label>
      <span class="lbl">Assister bearer token</span>
      <input id="bearerToken" type="password" placeholder="provided by Civica" />
    </label>

    <label>
      <span class="lbl">Active packet ID (optional — usually set from Civica dashboard)</span>
      <input id="activePacketId" type="text" placeholder="uuid" />
    </label>

    <button id="save">Save</button>
    <div id="status" class="status" role="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
