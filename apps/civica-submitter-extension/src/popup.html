<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica Submitter</title>
  <style>
    :root {
      --pine: #1f4d3b;
      --pine-700: #163a2c;
      --cream: #f7f4ee;
      --ink: #1f2722;
      --muted: #5a5851;
      --line: #cbc6bc;
      --err: #8b1d11;
      --ok: #1f4d3b;
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      width: 340px;
    }
    main { padding: 18px 18px 20px; }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .sub { margin: 0 0 16px; color: var(--muted); font-size: 12px; }
    button {
      width: 100%;
      padding: 9px 14px;
      background: var(--pine);
      color: #fff;
      border: none;
      border-radius: 4px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--pine-700); }
    button[disabled] { background: #b9b4aa; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 500;
    }
    button.secondary:hover { background: #efe; color: var(--ink); }
    .row { margin-top: 10px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .dot.connected { background: var(--ok); }
    .dot.waiting { background: #C9922A; }
    .dot.error { background: var(--err); }

    /* user_code display */
    .usercode {
      font: 600 22px/1.2 "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      text-align: center;
      margin: 6px 0 4px;
      user-select: all;
    }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 12px; }

    /* picker */
    .picker { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow: auto; }
    .picker li { margin: 0 0 8px; }
    .packet {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .packet:hover { border-color: var(--pine); background: #fbfaf7; }
    .packet .name { font-weight: 600; font-size: 14px; }
    .packet .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.high { color: #8b1d11; border-color: #e3b3ad; background: #fbeeec; }
    .badge.medium { color: #B5511E; border-color: #e8c7ab; background: #fbf2e9; }
    .badge.low { color: #1f4d3b; border-color: #b8d2c4; background: #eef5f1; }

    .msg { font-size: 13px; margin: 10px 0; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .empty { color: var(--muted); font-size: 13px; margin: 14px 0; }
    .confirm { background: #eef5f1; border: 1px solid #b8d2c4; border-radius: 6px; padding: 12px; font-size: 13px; }
    .confirm strong { color: var(--pine); }
    .footer-link {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    .footer-link a { color: var(--muted); }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--line);
      border-top-color: var(--pine);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <h1>Civica Submitter</h1>
    <p class="sub">Fills BenefitsCal CBO forms from a Civica packet.</p>
    <div id="root" aria-live="polite"></div>
    <div class="footer-link"><a id="options-link" href="#">Advanced settings</a></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
