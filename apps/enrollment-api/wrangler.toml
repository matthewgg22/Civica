name = "civica-enrollment-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Rate limiting (TODO-2, /plan-eng-review pre-App-Store).
# Cloudflare Workers Rate Limiting API — per-binding bucket, keyed by the
# applicant's auth uid when authenticated, else by CF-Connecting-IP.
#
# RL_STRICT — token/account-sensitive endpoints. Bot probing the buddy
# invite token space or hammering oauth exchange should hit this first.
[[unsafe.bindings]]
name = "RL_STRICT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# RL_STANDARD — mutating applicant endpoints. Tight enough to stop
# script-driven fake-packet creation; loose enough that a real user
# clicking submit twice never hits it.
[[unsafe.bindings]]
name = "RL_STANDARD"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[vars]
SUPABASE_URL = "https://zgqphgcqfxsgviofsccs.supabase.co"
# T15: enable AI-powered coaching in the recert practice interview.
# ANTHROPIC_API_KEY must be set as a wrangler secret (never in [vars]).
RECERT_AI_ENABLED = "true"
# Buddy Add feature gate. Set to "true" to enable the buddy invite / accept flow.
# Off by default until DB migrations (20260566-20260569) are applied to staging.
BUDDY_ADD_ENABLED = "false"
# SENTRY_DSN is intentionally absent from [vars] — set it as a secret:
#   wrangler secret put SENTRY_DSN
# This prevents the DSN from being committed to source control.

# Local dev: create apps/enrollment-api/.dev.vars with:
#   SUPABASE_URL=https://zgqphgcqfxsgviofsccs.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY=...
#   SUPABASE_ANON_KEY=...
#   SENTRY_DSN=https://xxx@oXXXXX.ingest.sentry.io/YYYY
#
# T9 (state-connectors) integration stub — leave OFF unless intentionally
# enabling USPS address validation at packet creation:
#   ENABLE_ADDRESS_VALIDATION=true
#   USPS_CLIENT_ID=...                  # wrangler secret put USPS_CLIENT_ID
#   USPS_CLIENT_SECRET=...              # wrangler secret put USPS_CLIENT_SECRET
#
# T14 (Twilio recertification outreach) — set to use LiveTwilioAdapter in prod:
#   RECERT_TWILIO_ENABLED=true
#   TWILIO_ACCOUNT_SID=...              # wrangler secret put TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN=...               # wrangler secret put TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER=+1...            # wrangler secret put TWILIO_FROM_NUMBER
#
# T15 (AI coaching for practice interview) — enable coaching via Claude Haiku:
#   RECERT_AI_ENABLED=true
#   ANTHROPIC_API_KEY=...               # wrangler secret put ANTHROPIC_API_KEY
#
# T-DR3-8 (Argyle webhook) — optional; signature verification skipped when absent.
# Get the webhook secret from the Argyle dashboard → Webhooks → Signing secret.
#   ARGYLE_WEBHOOK_SECRET=...           # wrangler secret put ARGYLE_WEBHOOK_SECRET
#
# T-DR3-9 (Canvas OAuth proxy) — required for schedule integration.
# Register a Developer Key in your Canvas instance → Admin → Developer Keys.
# Redirect URI must match exactly: https://<worker-host>/v1/enrollment/oauth/canvas/exchange
#   CANVAS_CLIENT_ID=...                # wrangler secret put CANVAS_CLIENT_ID
#   CANVAS_CLIENT_SECRET=...           # wrangler secret put CANVAS_CLIENT_SECRET
#   CANVAS_INSTANCE_URL=https://myschool.instructure.com
#                                       # wrangler secret put CANVAS_INSTANCE_URL
#   CANVAS_REDIRECT_URI=https://civica-enrollment-api.workers.dev/v1/enrollment/oauth/canvas/exchange
#                                       # wrangler secret put CANVAS_REDIRECT_URI
#
# Session M1 (BenefitsCal Phase 2 async submission) — CBO Manager credentials.
# Required only when the Phase 2 submitter is enabled per-packet (see
# packages/benefitscal-cbo/README.md for the rollout gate). Set via:
#   BENEFITSCAL_CBO_USERNAME=...        # wrangler secret put BENEFITSCAL_CBO_USERNAME
#   BENEFITSCAL_CBO_PASSWORD=...        # wrangler secret put BENEFITSCAL_CBO_PASSWORD
#   BENEFITSCAL_BASE_URL=https://...    # optional override; defaults to https://benefitscal.com
#                                       # wrangler secret put BENEFITSCAL_BASE_URL
#
# Buddy Add (BUDDY_ADD_ENABLED) — dedicated signing key for invite JWTs.
# Separate from SNAP_FERNET_KEY so buddy invite tokens can be rotated independently.
# Generate with: openssl rand -base64 32
#   BUDDY_JWT_SECRET=...              # wrangler secret put BUDDY_JWT_SECRET
#
# EBT Tracker (Lane D, T10) — APNs token-based push for deposit/low-balance/
# re-link notifications fired from POST /webhooks/ebt-scraper. All four
# secrets are required to actually send pushes; when any is missing the
# webhook still acks 200 and the apns-send helper logs "not-configured".
#
# Apple Push (current credentials):
#   APNs Key ID:  GLPJR3A3FD
#   Team ID:      687GD7CA6J
#   Bundle ID:    co.civica.benefits
#
# Bind via:
#   wrangler secret put APNS_KEY_P8        # paste the multi-line .p8 PEM contents
#   wrangler secret put APNS_KEY_ID        # "GLPJR3A3FD"
#   wrangler secret put APNS_TEAM_ID       # "687GD7CA6J"
#   wrangler secret put APNS_TOPIC         # "co.civica.benefits"
#   wrangler secret put APNS_ENV           # "production" or "development"
#
# EBT_SCRAPER_WEBHOOK_SECRET — HMAC shared with the Fly scraper:
#   wrangler secret put EBT_SCRAPER_WEBHOOK_SECRET
#   (and `fly secrets set EBT_SCRAPER_WEBHOOK_SECRET=...` on the scraper side)

# Civica Submitter extension — OAuth 2.0 device flow (issue #317).
#
# EXTENSION_BEARER_TOKEN (legacy, DEPRECATED): the single shared bearer the
# extension used before per-CBO device tokens. Still accepted on /extension/*
# for back-compat; remove once the extension ships the device-flow client.
#   wrangler secret put EXTENSION_BEARER_TOKEN
#
# EXTENSION_VERIFICATION_BASE_URL (optional [vars] or secret): origin of the
# dashboard that hosts the approval page. The device/authorize response returns
# `${EXTENSION_VERIFICATION_BASE_URL}/extension/connect` as verification_uri.
# Defaults to the production dashboard (https://civica-api.vercel.app) if unset.
# Set in [vars] for staging/preview overrides, e.g.:
#   EXTENSION_VERIFICATION_BASE_URL = "https://civica-api.vercel.app"
#
# No new secret is required for the device-flow tokens themselves — they are
# crypto-random, hashed in snap_enrollment.extension_device_tokens, and never
# derive from an env secret.
#
# DB: apply supabase/migrations/20260598_extension_device_oauth.sql via the
# Supabase dashboard SQL editor before enabling the flow (Civica has no
# automated migration pipeline; `supabase db push --linked` targets PROD).

# TODO-15 (Browserless.io driver) — external Playwright service for Phase 2.
# When set, POST /benefitscal/submit/:packetId auto-builds a Browserless driver
# and the submitter drives the BenefitsCal portal via Browserless. When absent,
# the route marks newly queued rows failed with DRIVER_NOT_WIRED.
#
# Free tier: 1000 units/month (≈200x pilot volume). Migrate to a Fly.io sidecar
# once monthly submissions exceed ~500 OR a data-pass-through audit requires
# in-house browser execution. See packages/benefitscal-cbo/README.md for the
# v1→v2 migration playbook.
#   BROWSERLESS_API_KEY=...             # wrangler secret put BROWSERLESS_API_KEY

# Scheduled (cron) triggers — handled by the `scheduled()` export in src/index.ts.
# Track 1 / M1: nightly USDA SNAP Retailer Locator sync at 03:00 UTC. The
# handler is currently stub-mode (no live records ingested) until the public
# USDA endpoint URL + field map is verified. The cron still runs so
# find_help_sources timestamps stay fresh and the path is observable.
# T2 (/plan-eng-review 2026-05-22): every 5 minutes, clear app_metadata.role
# for completed/revoked buddy relationships. See src/cron/buddy-app-metadata-cleanup.ts.
# T5 (/plan-eng-review 2026-05-24): daily authed probe at 14:00 UTC (6 AM PT,
# after the CA issuance window). Detects ebt.ca.gov structural drift before
# users hit parseError. See src/cron/ebt-probe.ts.
#
# B-T7 (2026-05-26-ebt-offer-moment-platform): weekly digest cron, two-shard
# (NOT 24-shard per outside-voice F11 fix). Sunday 17:00 UTC = 09:00 PT (PDT);
# Sunday 14:00 UTC = 09:00 ET (EDT). DST acknowledged limitation. See
# src/cron/weekly-digest.ts.
# X-T5 (same plan): daily 04:00 UTC purge of user_push_log rows >30d old.
#
# T4 (error-rate-engine-falsification): hourly QC sampler. Reads submitted
# packets and writes packet_qc_samples rows for the modular-10 subset. See
# src/cron/internal-qc-sampler.ts. NOTE: this brings us to 6 cron triggers,
# one over the free-plan limit of 5. Either upgrade the CF Workers plan
# before `wrangler deploy`, OR drop one of the existing crons (the USDA
# stub was already dropped for the same reason). Deferring activation to
# operator step in §9 deployment.
[triggers]
# USDA retailer sync ("0 3 * * *") dropped: stub-mode, free plan limit is 5.
# Re-add when plan upgrades or USDA endpoint is live.
crons = ["*/5 * * * *", "0 14 * * *", "0 17 * * 7", "0 14 * * 7", "0 4 * * *", "0 * * * *"]
