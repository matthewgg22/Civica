<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civica</title>
  <meta name="description" content="Civica helps you plan your vote, check key deadlines, and take civic action in minutes.">

  <meta property="og:title" content="Civica">
  <meta property="og:description" content="Civica helps you plan your vote, check key deadlines, and take civic action in minutes.">
  <meta property="og:image" content="preview.png">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #0f2f63;
      --bg2: #3f82cf;
      --text: #f8fbff;
      --muted: #d7e6f8;
      --cta: #c84637;
      --cta-hover: #a1372b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(3px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--cta);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .button:hover {
      background: var(--cta-hover);
    }
  </style>
</head>
<body>
  <main>
    <h1>Civica</h1>
    <p>Civica helps you plan your vote, check registration and election deadlines, and take civic action with clear, fast steps.</p>
    <a class="button" href="https://apps.apple.com/app/id0000000000">Download on the App Store</a>
  </main>
</body>
</html>
