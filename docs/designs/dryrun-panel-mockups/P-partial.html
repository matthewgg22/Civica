<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica · State P · PARTIAL — 3 Variants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    /* ===== Shared atoms ===== */
    .p-stale-link {
      color: var(--pine);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
      cursor: pointer;
    }
    .p-stale-chip-text {
      color: var(--graphite);
      font-weight: 400;
      font-size: 13px;
      line-height: 18px;
      font-variant-numeric: tabular-nums;
    }

    /* V1 + V3 stale strip — warningSurface full-bleed band */
    .p-stale-strip-warning {
      background: var(--warningSurface);
      padding: 12px 20px;
      border-top: 1px solid rgba(181, 81, 30, 0.18);
      border-bottom: 1px solid rgba(181, 81, 30, 0.18);
      flex-shrink: 0;
    }
    .p-stale-head {
      display: grid;
      grid-template-columns: 18px 1fr;
      column-gap: 10px;
      align-items: start;
    }
    .p-stale-title {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }
    .p-stale-title .p-stale-link { margin-left: 8px; font-size: 16px; line-height: 22px; }
    .p-stale-foot {
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 4px 0 0 28px;
      font-variant-numeric: tabular-nums;
    }

    /* V2 stale strip — surfacePrimary card */
    .p-stale-strip-card {
      margin: 12px 20px 0;
      background: var(--surfacePrimary);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .p-stale-strip-card .p-stale-foot { margin-left: 28px; }

    /* Verdict strip */
    .p-verdict {
      padding-top: 20px;
    }

    /* V1 — flat ledger rows with appended Footnote stale chip */
    .p-rows-flat {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .p-rows-flat > li {
      display: grid;
      grid-template-columns: 18px 1fr;
      column-gap: 12px;
      align-items: start;
      padding: 14px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .p-rows-flat > li:last-child { border-bottom: 0; }
    .p-row-icon { width: 16px; height: 16px; margin-top: 3px; }
    .p-row-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }
    .p-row-detail {
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 0;
    }
    .p-row-stale-inline {
      color: var(--graphite);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    /* V2 — grouped iOS panel + pill stale chips */
    .p-cure-card {
      background: var(--brickSurface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .p-cure-head {
      display: grid;
      grid-template-columns: 20px 1fr;
      column-gap: 10px;
      align-items: start;
    }
    .p-cure-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }
    .p-cure-detail {
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 6px 0 12px 30px;
    }
    .p-stale-pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      background: var(--warningSurface);
      color: var(--warning);
      font-size: 12px;
      line-height: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      border-radius: 6px;
      margin-left: 30px;
      font-variant-numeric: tabular-nums;
    }

    /* V3 — timeline dot with warning ring */
    .p-dot-stale {
      box-shadow: 0 0 0 3px var(--warningSurface);
    }
    .p-dot-stale-outline {
      box-shadow: 0 0 0 3px var(--warningSurface);
      background: var(--paper);
      border: 2px solid var(--pine);
    }

    /* Footer status footnote */
    .p-status-footnote {
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 12px 4px 0;
      text-align: center;
    }
  </style>
</head>

                <p class="v3-node-label" style="font-weight: 400; color: var(--graphite);">Household — 3 people</p>
              </li>
            </ul>

            <p style="margin: 16px 0 0; font-size: 13px; line-height: 18px; color: var(--graphite); font-variant-numeric: tabular-nums;">All values as of 2hr ago. The warning ring around each dot signals staleness.</p>
          </div>
          <div class="footer">
            <button class="cta-disabled" type="button" disabled>Re-check when online</button>
            <button class="cta-text" type="button">Submit with cached results</button>
            <p class="p-status-footnote">Civica will re-check automatically when you're back online.</p>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </figure>

    </div>
  </div>
</body>
