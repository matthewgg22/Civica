<html lang="en">
<head>
  <meta charset="utf-8" />

  <style>
    /* Brick warning glyph (shared across variants) */
    .g-warn {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* V1 — hairline-bounded reason (no card chrome) */
    .g-reason-flat {
      padding: 16px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .g-reason-flat:first-of-type { border-top: 1px solid var(--hairline); }
    .g-reason-head {
      display: grid;
      grid-template-columns: 20px 1fr;
      column-gap: 10px;
      align-items: start;
    }
    .g-reason-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }
    .g-reason-detail {
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 6px 0 0 30px;
    }
    .g-reason-foot {
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 10px 0 0 30px;
      font-variant-numeric: tabular-nums;
    }

    /* V2 — brickSurface card reason */
    .g-reason-card {
      background: var(--brickSurface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .g-reason-card .g-reason-detail { margin-top: 6px; }
    .g-reason-card .g-reason-foot { margin-top: 12px; }

    /* V1 + V2 — ledger numbered next-steps */
    .g-steps {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      counter-reset: g-step;
    }
    .g-steps > li {
      counter-increment: g-step;
      display: grid;
      grid-template-columns: 24px 1fr;
      column-gap: 12px;
      align-items: start;
      padding: 14px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .g-steps > li:last-child { border-bottom: 0; }
    .g-steps > li::before {
      content: counter(g-step, decimal-leading-zero);
      font: 600 13px/22px inherit;
      color: var(--graphite);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    .g-step-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 2px;
    }
    .g-step-detail {
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 0;
    }

    /* V2 — iOS-style numbered rows in a grouped panel */
    .g-steps-ios {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: g-step-ios;
      background: var(--surfacePrimary);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      overflow: hidden;
    }
    .g-steps-ios > li {
      counter-increment: g-step-ios;
      display: grid;
      grid-template-columns: 28px 1fr;
      column-gap: 12px;
      align-items: start;
      padding: 14px 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .g-steps-ios > li:last-child { border-bottom: 0; }
    .g-steps-ios > li::before {
      content: counter(g-step-ios);
      width: 28px;
      height: 28px;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 600 13px/18px inherit;
      color: var(--graphite);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .g-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      background: transparent;
      color: var(--graphite);
      border: 0;
      font-family: inherit;
      font-size: 16px;
      line-height: 22px;
      font-weight: 400;
      cursor: pointer;
    }
  </style>
