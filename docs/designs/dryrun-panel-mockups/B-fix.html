<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica · State B · Two Things to Fix — 3 Variants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    /* B-specific atoms */
    .b-cure-card {
      background: var(--brickSurface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .b-cure-head {
      display: grid;
      grid-template-columns: 20px 1fr;
      column-gap: 10px;
      align-items: start;
    }
    .b-cure-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }
    .b-cure-detail {
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 6px 0 14px 30px;
    }
    .b-cure-action {
      margin-left: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 18px;
      background: var(--pine);
      color: #FFFFFF;
      border: 0;
      border-radius: 10px;
      font: 600 16px/22px inherit;
      letter-spacing: -0.1px;
      cursor: pointer;
    }
    .b-cure-foot {
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 14px 0 0 30px;
      font-variant-numeric: tabular-nums;
    }

    /* V1 ledger fix-row */
    .v1-fixrow {
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 12px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .v1-fixtag {
      display: inline-block;
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--brick);
      border: 1px solid var(--brick);
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .v1-fixrow .v1-ledger-label { font-weight: 600; }
    .v1-fixrow-detail {
      grid-column: 2 / -1;
      font-size: 16px;
      line-height: 22px;
      color: var(--graphite);
      margin: 4px 0 0;
    }
    .v1-fixrow-foot {
      grid-column: 2 / -1;
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 8px 0 0;
      font-variant-numeric: tabular-nums;
    }
    .v1-fixrow-cta {
      grid-column: 2 / -1;
      margin: 12px 0 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      height: 40px;
      padding: 0 16px;
      background: var(--pine);
      color: #FFFFFF;
      border: 0;
      border-radius: 8px;
      font: 600 15px/20px inherit;
      cursor: pointer;
    }

    /* V3 brick action node */
    .v3-action {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      background: var(--pine);
      color: #FFFFFF;
      border: 0;
      border-radius: 8px;
      font: 600 15px/20px inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

          </div>
          <div class="footer">
