<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica · State A · Ready to Submit — 3 Variants</title>

  <link rel="stylesheet" href="_shared.css" />

<body>
  <div class="canvas">
    <header class="canvas-head">
      <p class="canvas-eyebrow">State A · Dry-run PASS</p>

    <div class="canvas-grid">

          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <div class="status-icons">

            </div>
          </div>
          <div class="scroll">
            <div class="nav">
              <button class="nav-back" type="button">
                <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1 1.5 9l8 8" stroke="#4A4A4A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <h1 class="title">Application ready to submit</h1>
            <p class="subhead">Your application matches what the county worker expects to see. Submit when you're ready.</p>

              <svg class="check" viewBox="0 0 16 16" fill="none"><path d="M3 8.4 6.4 11.8 13 5.2" stroke="#2D5F4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="v1-status-text">Verified — ready to submit</span>

            <h2 class="section-heading">What we checked</h2>
            <ul class="v1-ledger">

              <li><p class="v1-ledger-label">OBBBA tracking</p><p class="v1-ledger-value">Complete</p></li>

            <div class="v1-total">
              <p class="v1-total-label">Estimated benefit</p>
              <p class="v1-total-value">$315/mo</p>
            </div>
            <p class="v1-foot">Final amount confirmed by county after submission.</p>
          </div>
          <div class="footer">
            <button class="cta" type="button">Submit application</button>
            <button class="cta-text" type="button">Review details</button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </figure>
