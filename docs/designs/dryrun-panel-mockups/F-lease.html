<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civica · State F · Lease Photo Capture — 3 Variants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .f-nav-bar {
      height: 44px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }
    .f-nav-title {
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      margin: 0;
    }
    .f-hero {
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      padding: 0 20px;
      box-sizing: border-box;
    }
    .f-viewfinder {
      position: relative;
      width: 200px;
      height: 140px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
    }
    .f-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--ink);
    }
    .f-corner.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
    .f-corner.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
    .f-corner.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
    .f-corner.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
    .f-hint {
      font-size: 13px;
      line-height: 18px;
      color: var(--graphite);
      margin: 12px 0 0;
    }
    .f-cta-cam {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 56px;
      background: var(--pine);
      color: #FFFFFF;
      border: 0;
      border-radius: 12px;
      font: 600 17px/22px inherit;
      letter-spacing: -0.1px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <header class="canvas-head">
      <p class="canvas-eyebrow">State F · Lease photo capture</p>
      <h1 class="canvas-title">Lease photo</h1>
      <p class="canvas-sub">Cure detail screen reached from State B. Viewfinder hero stays constant; requirements list is the variant axis.</p>
    </header>

    <div class="canvas-grid">

      <!-- =================== V1 — Quiet ledger =================== -->
      <figure class="frame-cell">
        <figcaption class="frame-label"><strong>Variant 1</strong>Quiet ledger</figcaption>
        <p class="frame-note">Requirements as flat hairline-divided rows with state circles on the right (a literal checklist column).</p>
        <main class="device" data-screen-label="F1 · Ledger">
          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <div class="status-icons">
              <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0" y="7" width="3" height="3" rx="0.6" fill="#1A1A1A"/><rect x="5" y="5" width="3" height="5" rx="0.6" fill="#1A1A1A"/><rect x="10" y="2.5" width="3" height="7.5" rx="0.6" fill="#1A1A1A"/><rect x="15" y="0" width="3" height="10" rx="0.6" fill="#1A1A1A"/></svg>
              <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 10.2a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2z" fill="#1A1A1A"/><path d="M3.4 6.1a6.5 6.5 0 019.2 0" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/><path d="M.9 3.5a10 10 0 0114.2 0" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1A1A1A" opacity="0.4"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#1A1A1A"/><rect x="23.5" y="4" width="1.5" height="4" rx="0.6" fill="#1A1A1A" opacity="0.5"/></svg>
            </div>
          </div>
          <nav class="f-nav-bar">
            <button class="nav-back" type="button" style="justify-self: start;"><svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1 1.5 9l8 8" stroke="#4A4A4A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
            <h1 class="f-nav-title">Lease photo</h1>
            <span></span>
          </nav>
          <div class="scroll" style="padding: 0;">
            <section class="f-hero">
              <div class="f-viewfinder" aria-hidden="true"><span class="f-corner tl"></span><span class="f-corner tr"></span><span class="f-corner bl"></span><span class="f-corner br"></span></div>
              <p class="f-hint">Position the rent line in the frame</p>
            </section>
            <div style="padding: 24px 20px 16px;">
              <h2 class="section-heading" style="margin-top: 0;">What we need</h2>
              <ul class="v1-ledger">
                <li style="grid-template-columns: 1fr 20px; padding: 14px 0;">
                  <p class="v1-ledger-label" style="font-weight: 400;">Monthly rent amount clearly visible</p>
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="justify-self: end;"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                </li>
                <li style="grid-template-columns: 1fr 20px; padding: 14px 0;">
                  <p class="v1-ledger-label" style="font-weight: 400;">Landlord name or property management</p>
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="justify-self: end;"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                </li>
                <li style="grid-template-columns: 1fr 20px; padding: 14px 0; border-bottom: 0;">
                  <p class="v1-ledger-label" style="font-weight: 400;">Date of lease (any year is fine)</p>
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="justify-self: end;"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                </li>
              </ul>
              <p style="margin: 16px 0 0; font-size: 13px; line-height: 18px; color: var(--graphite);">California SNAP credits your housing cost as a deduction. Your worker needs the exact monthly rent. (7 CFR 273.9(d)(6)(ii))</p>
            </div>
          </div>
          <div class="footer">
            <button class="f-cta-cam" type="button">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6.5h2.5L7 4.5h6L14.5 6.5H17a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" stroke="#FFFFFF" stroke-width="1.5"/></svg>
              <span>Take photo</span>
            </button>
            <button class="cta-text" type="button">Upload from photos</button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </figure>

      <!-- =================== V2 — Stacked notices =================== -->
      <figure class="frame-cell">
        <figcaption class="frame-label"><strong>Variant 2</strong>Stacked notices</figcaption>
        <p class="frame-note">Requirements grouped as an iOS-Settings panel with chevrons — tappable to see examples.</p>
        <main class="device" data-screen-label="F2 · Stacked">
          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <div class="status-icons">
              <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0" y="7" width="3" height="3" rx="0.6" fill="#1A1A1A"/><rect x="5" y="5" width="3" height="5" rx="0.6" fill="#1A1A1A"/><rect x="10" y="2.5" width="3" height="7.5" rx="0.6" fill="#1A1A1A"/><rect x="15" y="0" width="3" height="10" rx="0.6" fill="#1A1A1A"/></svg>

              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1A1A1A" opacity="0.4"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#1A1A1A"/><rect x="23.5" y="4" width="1.5" height="4" rx="0.6" fill="#1A1A1A" opacity="0.5"/></svg>
            </div>
          </div>
          <nav class="f-nav-bar">
            <button class="nav-back" type="button" style="justify-self: start;"><svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1 1.5 9l8 8" stroke="#4A4A4A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
            <h1 class="f-nav-title">Lease photo</h1>
            <span></span>
          </nav>
          <div class="scroll" style="padding: 0;">
            <section class="f-hero">
              <div class="f-viewfinder" aria-hidden="true"><span class="f-corner tl"></span><span class="f-corner tr"></span><span class="f-corner bl"></span><span class="f-corner br"></span></div>
              <p class="f-hint">Position the rent line in the frame</p>
            </section>
            <div style="padding: 0 20px 16px;">
              <p class="v2-group-head" style="margin-top: 20px;">What we need</p>
              <div class="v2-group">
                <div class="v2-row">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                  <p class="v2-row-label">Monthly rent amount clearly visible</p>
                  <svg class="v2-chevron" viewBox="0 0 8 14" fill="none"><path d="M1 1l5 6-5 6" stroke="#4A4A4A" stroke-width="1.4" stroke-linecap="round"/></svg>
                </div>
                <div class="v2-row">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                  <p class="v2-row-label">Landlord name or property management</p>
                  <svg class="v2-chevron" viewBox="0 0 8 14" fill="none"><path d="M1 1l5 6-5 6" stroke="#4A4A4A" stroke-width="1.4" stroke-linecap="round"/></svg>
                </div>
                <div class="v2-row">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="#4A4A4A" stroke-width="1.4" opacity="0.45"/></svg>
                  <p class="v2-row-label">Date of lease (any year is fine)</p>
                  <svg class="v2-chevron" viewBox="0 0 8 14" fill="none"><path d="M1 1l5 6-5 6" stroke="#4A4A4A" stroke-width="1.4" stroke-linecap="round"/></svg>
                </div>
              </div>
              <p style="margin: 20px 4px 0; font-size: 13px; line-height: 18px; color: var(--graphite);">California SNAP credits your housing cost as a deduction. Your worker needs the exact monthly rent. (7 CFR 273.9(d)(6)(ii))</p>
            </div>
          </div>
          <div class="footer">
            <button class="f-cta-cam" type="button">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6.5h2.5L7 4.5h6L14.5 6.5H17a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" stroke="#FFFFFF" stroke-width="1.5"/></svg>
              <span>Take photo</span>
            </button>
            <button class="cta-text" type="button">Upload from photos</button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </figure>

      <!-- =================== V3 — Status timeline =================== -->
      <figure class="frame-cell">
        <figcaption class="frame-label"><strong>Variant 3</strong>Status timeline</figcaption>
        <p class="frame-note">Requirements as a checklist timeline — dots flip pine once the OCR confirms each is captured.</p>
        <main class="device" data-screen-label="F3 · Timeline">
          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <div class="status-icons">
              <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0" y="7" width="3" height="3" rx="0.6" fill="#1A1A1A"/><rect x="5" y="5" width="3" height="5" rx="0.6" fill="#1A1A1A"/><rect x="10" y="2.5" width="3" height="7.5" rx="0.6" fill="#1A1A1A"/><rect x="15" y="0" width="3" height="10" rx="0.6" fill="#1A1A1A"/></svg>
              <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 10.2a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2z" fill="#1A1A1A"/><path d="M3.4 6.1a6.5 6.5 0 019.2 0" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/><path d="M.9 3.5a10 10 0 0114.2 0" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1A1A1A" opacity="0.4"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#1A1A1A"/><rect x="23.5" y="4" width="1.5" height="4" rx="0.6" fill="#1A1A1A" opacity="0.5"/></svg>
            </div>
          </div>
          <nav class="f-nav-bar">
            <button class="nav-back" type="button" style="justify-self: start;"><svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1 1.5 9l8 8" stroke="#4A4A4A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
            <h1 class="f-nav-title">Lease photo</h1>
            <span></span>
          </nav>
          <div class="scroll" style="padding: 0;">
            <section class="f-hero">
              <div class="f-viewfinder" aria-hidden="true"><span class="f-corner tl"></span><span class="f-corner tr"></span><span class="f-corner bl"></span><span class="f-corner br"></span></div>
              <p class="f-hint">Position the rent line in the frame</p>
            </section>
            <div style="padding: 0 20px 16px;">
              <h2 class="section-heading">Must include</h2>
              <ul class="v3-timeline">
                <li class="v3-node">
                  <span class="v3-dot" aria-hidden="true"></span>
                  <p class="v3-node-label">Monthly rent amount</p>
                  <p class="v3-node-foot">Most important — clearly readable</p>
                </li>
                <li class="v3-node">
                  <span class="v3-dot" aria-hidden="true"></span>
                  <p class="v3-node-label">Landlord name or property management</p>
                </li>
                <li class="v3-node">
                  <span class="v3-dot" aria-hidden="true"></span>
                  <p class="v3-node-label">Date of lease</p>
                  <p class="v3-node-foot">Any year is fine</p>
                </li>
              </ul>
              <p style="margin: 16px 0 0; font-size: 13px; line-height: 18px; color: var(--graphite);">CA SNAP credits your housing cost as a deduction. (7 CFR 273.9(d)(6)(ii))</p>
            </div>
          </div>
          <div class="footer">
            <button class="f-cta-cam" type="button">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6.5h2.5L7 4.5h6L14.5 6.5H17a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" stroke="#FFFFFF" stroke-width="1.5"/></svg>
              <span>Take photo</span>
            </button>
            <button class="cta-text" type="button">Upload from photos</button>

    </div>
  </div>
</body>
</html>
